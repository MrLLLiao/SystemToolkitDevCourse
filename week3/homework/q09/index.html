<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 + 待办</title>
<style>
  :root { --green: #2e9e6b; --green-dark: #237a53; --bg: #f2f7f4; --ink: #22302a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); display: flex; justify-content: center; padding: 40px 16px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(46,158,107,.15);
          width: 100%; max-width: 420px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
  .sub { text-align: center; color: #7d8f87; font-size: 13px; margin: 0 0 22px; }
  .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .modes button { border: 1px solid #dbe8e1; background: #fff; color: var(--ink); border-radius: 999px;
                  padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .modes button.active { background: var(--green); color: #fff; border-color: var(--green); }
  .timer { text-align: center; font-size: 64px; font-weight: 700; letter-spacing: 2px;
           font-variant-numeric: tabular-nums; margin: 6px 0 18px; }
  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .controls button { border: none; border-radius: 10px; padding: 10px 22px; font-size: 15px; cursor: pointer; }
  #startBtn { background: var(--green); color: #fff; }
  #resetBtn { background: #eef3f0; color: var(--ink); }
  .status { text-align: center; font-size: 13px; color: var(--green-dark); min-height: 18px; margin: 8px 0 4px; }
  hr { border: none; border-top: 1px solid #e8efeb; margin: 20px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .todo-input { display: flex; gap: 8px; }
  .todo-input input { flex: 1; border: 1px solid #dbe8e1; border-radius: 10px; padding: 9px 12px; font-size: 14px; }
  .todo-input button { border: none; background: var(--green); color: #fff; border-radius: 10px; padding: 0 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f5f2; font-size: 14px; }
  li.done span { text-decoration: line-through; color: #9fb3aa; }
  li .text { flex: 1; }
  li button.del { border: none; background: none; color: #c0504d; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <h1>🍅 番茄钟</h1>
  <p class="sub">专注 25 分钟，休息一下</p>
  <div class="modes" id="modes">
    <button data-min="25" class="active">25 分</button>
    <button data-min="45">45 分</button>
    <button data-min="60">60 分</button>
  </div>
  <div class="timer" id="timer">25:00</div>
  <div class="controls">
    <button id="startBtn">开始</button>
    <button id="resetBtn">重置</button>
  </div>
  <div class="status" id="status"></div>

  <hr>
  <h2>📝 待办清单</h2>
  <div class="todo-input">
    <input id="todoText" placeholder="添加一个待办…" maxlength="120">
    <button id="addTodo">添加</button>
  </div>
  <ul id="todoList"></ul>
</div>

<script>
(function () {
  "use strict";
  var TIMER_KEY = "pomodoro_state";
  var TODO_KEY = "pomodoro_todos";
  var totalSeconds = 25 * 60;
  var remain = totalSeconds;
  var running = false;
  var intervalId = null;
  var timerEl = document.getElementById("timer");
  var statusEl = document.getElementById("status");
  var startBtn = document.getElementById("startBtn");
  var resetBtn = document.getElementById("resetBtn");
  var modeBtns = document.querySelectorAll("#modes button");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function render() {
    var m = Math.floor(remain / 60);
    var s = remain % 60;
    timerEl.textContent = pad(m) + ":" + pad(s);
    document.title = timerEl.textContent + " · 番茄钟";
    saveState();
  }

  function saveState() {
    var data = { remain: remain, total: totalSeconds, running: running, label: currentLabel() };
    try { localStorage.setItem(TIMER_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function currentLabel() {
    for (var i = 0; i < modeBtns.length; i++) {
      if (modeBtns[i].classList.contains("active")) return modeBtns[i].dataset.min;
    }
    return "25";
  }

  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(); osc.stop(ctx.currentTime + 0.6);
    } catch (e) { /* 提示音失败不影响功能 */ }
  }

  function finish() {
    running = false; clearInterval(intervalId); intervalId = null;
    startBtn.textContent = "开始";
    beep();
    statusEl.textContent = "⏰ 时间到！休息一下吧";
    render();
  }

  function tick() {
    if (remain <= 1) {
      remain = 0; render(); finish(); return;
    }
    remain -= 1;
    render();
  }

  function start() {
    if (running) return;
    if (remain <= 0) remain = totalSeconds;
    running = true;
    startBtn.textContent = "暂停";
    statusEl.textContent = "专注中…";
    intervalId = setInterval(tick, 1000);
    render();
  }

  function pause() {
    running = false; clearInterval(intervalId); intervalId = null;
    startBtn.textContent = "开始";
    statusEl.textContent = "已暂停";
    render();
  }

  function reset() {
    running = false; clearInterval(intervalId); intervalId = null;
    remain = totalSeconds;
    startBtn.textContent = "开始";
    statusEl.textContent = "";
    render();
  }

  startBtn.addEventListener("click", function () {
    if (running) pause(); else start();
  });
  resetBtn.addEventListener("click", reset);

  modeBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      modeBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      reset();
      statusEl.textContent = "时长已切换为 " + btn.dataset.min + " 分钟";
    });
  });

  /* ---------- 待办清单（localStorage 持久化） ---------- */
  var listEl = document.getElementById("todoList");
  var textEl = document.getElementById("todoText");

  function loadTodos() {
    try {
      var raw = localStorage.getItem(TODO_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function storeTodos(list) {
    try { localStorage.setItem(TODO_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function renderTodos() {
    var list = loadTodos();
    listEl.innerHTML = "";
    list.forEach(function (item, idx) {
      var li = document.createElement("li");
      if (item.done) li.classList.add("done");
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!item.done;
      cb.addEventListener("change", function () {
        var l = loadTodos(); l[idx].done = cb.checked; storeTodos(l); renderTodos();
      });
      var span = document.createElement("span");
      span.className = "text"; span.textContent = item.text;
      var del = document.createElement("button");
      del.className = "del"; del.textContent = "✕";
      del.addEventListener("click", function () {
        var l = loadTodos(); l.splice(idx, 1); storeTodos(l); renderTodos();
      });
      li.appendChild(cb); li.appendChild(span); li.appendChild(del);
      listEl.appendChild(li);
    });
  }
  function addTodo() {
    var v = textEl.value.trim();
    if (!v) return;
    var l = loadTodos(); l.push({ text: v, done: false }); storeTodos(l);
    textEl.value = ""; renderTodos();
  }
  document.getElementById("addTodo").addEventListener("click", addTodo);
  textEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addTodo(); });

  /* 恢复上次状态 */
  try {
    var saved = JSON.parse(localStorage.getItem(TIMER_KEY) || "null");
    if (saved && saved.total) {
      totalSeconds = saved.total;
      remain = saved.remain;
      if (saved.running) start();
    }
  } catch (e) {}
  render();
  renderTodos();
})();
</script>
</body>
</html>
