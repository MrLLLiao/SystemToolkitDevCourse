# q12: 编程智能体隔离沙箱（YOLO 模式安全容器）
# 安全设计要点：
#   - read_only: true            根文件系统只读 → agent 改不了系统/镜像文件
#   - cap_drop: [ALL]            丢弃全部 Linux 能力 → 不能 mount/chown/setuid...
#   - security_opt: no-new-privileges → 不能借 setuid 提权
#   - pids_limit / mem_limit     进程数与内存上限 → 进程炸弹/内存耗尽被兜底
#   - network_mode: none         完全断网 → 无法外泄/外联
#   - 命名卷 workdir             唯一可写盘区，退出即弃（可挂宿主安全区收集产物）
# 构建需走宿主代理（本机 fake-IP DNS 根因，见 q03/ANSWER.md）
services:
  sandbox:
    build:
      context: .
      args:
        HTTP_PROXY: "http://172.26.224.1:7890"
        HTTPS_PROXY: "http://172.26.224.1:7890"
        NO_PROXY: "localhost,127.0.0.1"
    image: q12-agent-sandbox:latest
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    network_mode: none
    working_dir: /work
    volumes:
      - ./yolo_demo.sh:/work/yolo_demo.sh:ro
      - workdir:/work/workdir
    tmpfs:
      - /tmp
    command: bash /work/yolo_demo.sh

volumes:
  workdir: