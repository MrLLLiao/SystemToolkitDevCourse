# tmux 基础定制配置（对应 ~/.tmux.conf）
# 参考: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# 把前缀键从 Ctrl-b 改成 Ctrl-a（更顺手）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 启用鼠标支持（点击切换面板/窗口、滚轮翻页）
set -g mouse on

# 窗口与面板从 1 开始编号（而不是 0）
set -g base-index 1
setw -g pane-base-index 1

# 状态栏配色
set -g status-bg black
set -g status-fg green

# 复制模式使用 vi 键位
setw -g mode-keys vi
